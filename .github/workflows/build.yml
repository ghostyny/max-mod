name: build
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile dylib
        run: |
          xcrun -sdk iphoneos clang -arch arm64 -miphoneos-version-min=15.0 \
            -dynamiclib -fno-objc-arc -framework Foundation -framework UIKit -framework QuartzCore -framework CoreGraphics \
            -o MaxGhost.dylib Tweak.m
      - uses: actions/upload-artifact@v4
        with:
          name: MaxGhost
          path: MaxGhost.dylib
